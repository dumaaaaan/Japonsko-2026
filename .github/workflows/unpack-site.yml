name: Unpack Japan travel diary

on:
  push:
    paths:
      - '2-japonsko-2026.zip'
      - '.github/workflows/unpack-site.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract website files
        run: |
          rm -rf css js photos vendor index.html trip-data.json .nojekyll
          mkdir -p /tmp/japan-site
          unzip -q 2-japonsko-2026.zip -d /tmp/japan-site
          cp -a /tmp/japan-site/japonsko-2026/. .
          rm 2-japonsko-2026.zip

      - name: Commit website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Japan travel diary website"
          git push
